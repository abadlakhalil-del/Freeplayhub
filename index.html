<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreePlay Hub</title>
<style>
:root{
  --bg:#0f1220; --panel:#171b2e; --panel2:#1f2440; --text:#e9ecf8; --muted:#98a0c3;
  --accent:#6c5ce7; --accent2:#00d1b2; --warn:#ffb020; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Tahoma,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.container{max-width:1180px;margin:0 auto;padding:0 16px}

/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(15,18,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid #262c4d}
.nav{display:flex;align-items:center;gap:12px;padding:12px 0}
.logo{font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;padding:11px 42px;border-radius:999px;border:1px solid #2b3260;background:var(--panel);color:var(--text);outline:none;font-size:.95rem}
.search input:focus{border-color:var(--accent)}
.search::before{content:"🔍";position:absolute;inset-inline-start:15px;top:50%;transform:translateY(-50%);font-size:.9rem}
.nav-links{display:flex;gap:6px}
.nav-links button{background:transparent;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600}
.nav-links button:hover,.nav-links button.active{background:var(--panel2);color:var(--text)}
.lang{background:var(--panel);color:var(--text);border:1px solid #2b3260;border-radius:10px;padding:8px 10px;font:inherit;font-size:.9rem}

/* Hero */
.hero{margin:22px 0;border-radius:24px;padding:34px 28px;background:linear-gradient(135deg,#3a2fb5,#6c5ce7 45%,#00b4a0);position:relative;overflow:hidden}
.hero::after{content:"🎮";position:absolute;inset-inline-end:24px;bottom:-20px;font-size:9rem;opacity:.18;transform:rotate(-12deg)}
.hero h1{font-size:clamp(1.5rem,4vw,2.4rem);line-height:1.3;max-width:600px}
.hero p{margin:10px 0 18px;max-width:540px;opacity:.92}
.hero .stats{display:flex;gap:26px;flex-wrap:wrap}
.hero .stats b{display:block;font-size:1.3rem}
.hero .stats small{opacity:.85}

/* Filters */
.filters{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 16px;border-radius:999px;background:var(--panel);border:1px solid #2b3260;color:var(--muted);font-weight:600;font-size:.9rem}
.chip:hover{color:var(--text)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.toolbar h2{font-size:1.15rem}
select{background:var(--panel);color:var(--text);border:1px solid #2b3260;border-radius:10px;padding:8px 10px;font:inherit}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:40px}
.card{background:var(--panel);border-radius:var(--radius);overflow:hidden;border:1px solid #262c4d;cursor:pointer;transition:transform .18s,border-color .18s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.thumb{height:130px;display:grid;place-items:center;font-size:3.6rem;position:relative;overflow:hidden}
.thumb img,.m-icon img,.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;z-index:2;top:10px;inset-inline-start:10px;background:rgba(0,0,0,.55);padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700}
.fav{position:absolute;z-index:2;top:8px;inset-inline-end:8px;background:rgba(0,0,0,.55);width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.fav.on{background:#ff4d6d}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-size:1rem}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem;gap:6px}
.plats{display:flex;gap:6px;font-size:.95rem;margin-top:auto}
.dl-mini{margin-top:6px;background:linear-gradient(135deg,var(--accent),#8b7bff);padding:9px;border-radius:10px;font-weight:700;text-align:center;font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:50px 0;grid-column:1/-1}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(5,7,16,.75);display:none;align-items:flex-end;justify-content:center;z-index:100}
.overlay.open{display:flex}
.modal{background:var(--panel);width:100%;max-width:760px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:700px){.overlay{align-items:center;padding:20px}.modal{border-radius:24px}}
.m-head{display:flex;gap:16px;padding:20px;align-items:center;position:relative}
.m-icon{width:96px;height:96px;border-radius:22px;display:grid;place-items:center;font-size:3rem;flex:0 0 auto;position:relative;overflow:hidden}
.m-head h2{font-size:1.4rem;padding-inline-end:40px}
.m-head p{color:var(--muted);font-size:.9rem}
.close{position:absolute;top:14px;inset-inline-end:14px;background:var(--panel2);width:36px;height:36px;border-radius:50%;font-size:1rem}
.m-body{padding:0 20px 24px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:6px 0 18px}
.fact{background:var(--panel2);border-radius:12px;padding:10px;text-align:center}
.fact b{display:block}
.fact small{color:var(--muted)}
.m-body h4{margin:16px 0 8px}
.m-body p.desc{color:#c3c9e8}
.shots{display:flex;gap:10px;overflow-x:auto;padding:4px 0}
.shot{flex:0 0 120px;height:200px;border-radius:14px;display:grid;place-items:center;font-size:2rem;position:relative;overflow:hidden}
.dl-list{display:grid;gap:10px}
.dl-group{font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.dl-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid #2f3668;font-weight:600;width:100%;text-align:start}
.dl-btn:hover{border-color:var(--accent2)}
.dl-btn .ic{font-size:1.4rem}
.dl-btn small{display:block;color:var(--muted);font-weight:400}
.dl-btn .go{margin-inline-start:auto;background:var(--accent2);color:#05231f;padding:6px 12px;border-radius:8px;font-weight:800;font-size:.85rem;white-space:nowrap}
.note{font-size:.78rem;color:var(--muted);margin-top:12px}
.stars{color:var(--warn)}

/* Play now */
.play-btn{background:linear-gradient(135deg,#00b894,#00d1b2);color:#04251f;font-weight:800;padding:9px;border-radius:10px;font-size:.9rem;width:100%}
.play-btn:hover{filter:brightness(1.08)}
.play-btn.big{padding:14px;font-size:1.05rem;margin:4px 0 14px;border-radius:12px}
.card .play-btn{margin-top:6px}
.card .play-btn + .dl-mini{margin-top:4px}
#playerOverlay{align-items:stretch;padding:0;background:#0b0d18}
.p-box{display:flex;flex-direction:column;width:100%;height:100%}
.p-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid #262c4d;gap:10px}
.p-bar b{font-size:1rem}
.p-bar .p-actions{display:flex;gap:8px;align-items:center}
.p-bar a,.p-bar button{background:var(--panel2);border:1px solid #2f3668;color:var(--text);padding:7px 12px;border-radius:10px;font-size:.88rem;font-weight:600}
#pFrame{flex:1;width:100%;border:0;background:#262421}

/* Donate */
.donate-btn{background:linear-gradient(135deg,#0070ba,#1546a0);color:#fff;padding:8px 14px;border-radius:10px;font-weight:700;font-size:.9rem;white-space:nowrap}
.donate-btn:hover{filter:brightness(1.12)}
.support{background:linear-gradient(135deg,#0b2a4a,#12315e);border:1px solid #1d4f8f;border-radius:20px;padding:24px;margin:0 0 40px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.support h3{font-size:1.2rem;margin-bottom:4px}
.support p{color:#b9c8e6;max-width:560px}
.support .donate-btn{padding:12px 22px;font-size:1rem}
.d-modal{padding:24px;max-width:460px;position:relative}
.d-modal h2{font-size:1.3rem;margin-bottom:6px;padding-inline-end:40px}
.d-modal p{color:var(--muted);font-size:.92rem}
.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 10px}
.amt{background:var(--panel2);border:1px solid #2f3668;border-radius:12px;padding:12px 0;font-weight:700}
.amt.active{background:#0070ba;border-color:#0070ba;color:#fff}
.d-custom{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #2f3668;background:var(--panel2);color:var(--text);font:inherit;outline:none;margin-bottom:14px}
.d-custom:focus{border-color:#0070ba}
.d-go{width:100%;background:#ffc439;color:#111;font-weight:800;padding:14px;border-radius:12px;font-size:1rem}
.d-go:hover{filter:brightness(1.06)}
.d-note{margin-top:12px;font-size:.78rem;text-align:center}
@media(max-width:640px){.donate-btn{padding:8px 10px;font-size:.82rem}}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#222850;border:1px solid var(--accent);padding:12px 18px;border-radius:12px;z-index:200;transition:transform .3s;max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

footer{border-top:1px solid #262c4d;padding:26px 0;color:var(--muted);font-size:.88rem;text-align:center}
@media(max-width:640px){
  .nav{flex-wrap:wrap}
  .search{order:3;flex-basis:100%}
  .nav-links{display:none}
  .logo{flex:1}
  .hero{padding:26px 20px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .thumb{height:100px;font-size:2.8rem}
}
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a class="logo" href="#" id="logo">🎮 <span>FreePlay Hub</span></a>
    <nav class="nav-links">
      <button class="active" data-view="all" data-i18n="home"></button>
      <button data-view="fav">❤ <span data-i18n="favorites"></span></button>
    </nav>
    <button class="donate-btn" data-donate>💙 <span data-i18n="donate"></span></button>
    <select class="lang" id="lang" aria-label="Language">
      <option value="ar">العربية</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
    </select>
    <div class="search"><input id="q" type="search" data-i18n-ph="search" autocomplete="off"></div>
  </div>
</header>

<main class="container">
  <section class="hero">
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n="heroText"></p>
    <div class="stats">
      <div><b id="statGames">0</b><small data-i18n="statGames"></small></div>
      <div><b>5</b><small data-i18n="statPlatforms"></small></div>
      <div><b>100%</b><small data-i18n="statFree"></small></div>
    </div>
  </section>

  <section class="filters">
    <div class="row" id="platRow"></div>
    <div class="row" id="catRow"></div>
  </section>

  <div class="toolbar">
    <h2 id="title"></h2>
    <select id="sort"></select>
  </div>
  <section class="grid" id="grid"></section>

  <section class="support">
    <div>
      <h3>💙 <span data-i18n="supportTitle"></span></h3>
      <p data-i18n="supportText"></p>
    </div>
    <button class="donate-btn" data-donate>💳 <span data-i18n="donateGo"></span></button>
  </section>
</main>

<footer>
  <div class="container">© <span id="yr"></span> FreePlay Hub · <span data-i18n="footer"></span></div>
</footer>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="overlay" id="playerOverlay">
  <div class="p-box">
    <div class="p-bar">
      <b id="pTitle"></b>
      <div class="p-actions">
        <a id="pNew" href="#" target="_blank" rel="noopener">↗ <span id="pNewTxt"></span></a>
        <button id="pFs" aria-label="Fullscreen">⛶</button>
        <button data-close-player>✕ <span id="pCloseTxt"></span></button>
      </div>
    </div>
    <iframe id="pFrame" title="Game" allow="fullscreen" src="about:blank"></iframe>
  </div>
</div>
<div class="overlay" id="donateOverlay"><div class="modal d-modal" id="donateModal"></div></div>
<div class="toast" id="toast"></div>

/* =====================================================================
   4) APP LOGIC
   ===================================================================== */
const $ = s=>document.querySelector(s);
let lang = "ar";
try{
  const saved = localStorage.getItem("fph_lang");
  const nav = (navigator.language||"ar").slice(0,2);
  lang = saved && I18N[saved] ? saved : (I18N[nav] ? nav : "ar");
}catch(e){}
const t = k => I18N[lang][k] ?? I18N.en[k] ?? k;
const L = obj => typeof obj==="string" ? obj : (obj[lang] || obj.en || Object.values(obj)[0]);

let state = {q:"",plat:"all",cat:"all",sort:"pop",view:"all"};
let openId = null;
let favs = new Set();
try{ favs = new Set(JSON.parse(localStorage.getItem("fph_favs")||"[]")); }catch(e){}
const saveFavs = ()=>{ try{ localStorage.setItem("fph_favs",JSON.stringify([...favs])); }catch(e){} };

const fmtDl = n => n>=1e6 ? (n/1e6).toFixed(1)+"M" : n>=1e3 ? Math.round(n/1e3)+"K" : n;
const fmtSize = mb => mb>=1000 ? (mb/1000).toFixed(1)+" GB" : mb+" MB";
const stars = r => "★".repeat(Math.round(r))+"☆".repeat(5-Math.round(r));
const grad = c => `linear-gradient(135deg,${c[0]},${c[1]})`;
const fmtDate = d => { try{ return new Date(d).toLocaleDateString(I18N[lang].locale,{year:"numeric",month:"short",day:"numeric"}); }catch(e){ return d; } };
const esc = s => String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const imgTag = src => src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : "";
const CATS = ["all",...new Set(GAMES.map(g=>g.cat))];
const catName = k => k==="all" ? t("allCats") : (I18N[lang].cats[k]||k);

function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(el._h);el._h=setTimeout(()=>el.classList.remove("show"),2800)}

/* ---- static text ---- */
function applyLang(){
  const d = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = d.dir;
  document.title = "FreePlay Hub – " + t("statGames");
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  $("#lang").value = lang;
  $("#sort").innerHTML = [["pop","sortPop"],["rate","sortRate"],["new","sortNew"],["size","sortSize"]]
    .map(([v,k])=>`<option value="${v}" ${state.sort===v?"selected":""}>${t(k)}</option>`).join("");
  renderFilters(); renderGrid();
  if(openId) openGame(openId);
  if(donateOpen) renderDonate();
}

function renderFilters(){
  const pr = [["all","🌐 "+t("allPlatforms")],["play","▶ "+t("playNow")],...Object.entries(PLATFORMS).map(([k,v])=>[k,v.icon+" "+v.label])];
  $("#platRow").innerHTML = pr.map(([k,l])=>`<button class="chip ${state.plat===k?"active":""}" data-plat="${k}">${l}</button>`).join("");
  $("#catRow").innerHTML = CATS.map(c=>`<button class="chip ${state.cat===c?"active":""}" data-cat="${c}">${catName(c)}</button>`).join("");
}

function getList(){
  const q = state.q.trim().toLowerCase();
  const l = GAMES.filter(g=>
    (state.view==="all"||favs.has(g.id)) &&
    (state.plat==="all"||(state.plat==="play"?!!g.play:g.plats.includes(state.plat))) &&
    (state.cat==="all"||g.cat===state.cat) &&
    (!q || (L(g.name)+" "+g.dev+" "+catName(g.cat)).toLowerCase().includes(q))
  );
  const s = {pop:(a,b)=>b.dl-a.dl, rate:(a,b)=>b.rating-a.rating, new:(a,b)=>b.date.localeCompare(a.date), size:(a,b)=>a.size-b.size}[state.sort];
  return l.sort(s);
}

function renderGrid(){
  const list = getList();
  $("#statGames").textContent = GAMES.length;
  $("#title").textContent = (state.view==="fav"?t("myFavs"):t("allGames"))+` (${list.length})`;
  $("#grid").innerHTML = list.length ? list.map(g=>`
    <article class="card" data-id="${g.id}">
      <div class="thumb" style="background:${grad(g.c)}">
        ${g.emoji}${imgTag(g.img)}
        <span class="badge">${catName(g.cat)}</span>
        <button class="fav ${favs.has(g.id)?"on":""}" data-fav="${g.id}" aria-label="Favorite">${favs.has(g.id)?"❤":"♡"}</button>
      </div>
      <div class="info">
        <h3>${esc(L(g.name))}</h3>
        <div class="meta"><span class="stars">★ ${g.rating}</span><span>⬇ ${fmtDl(g.dl)}</span><span>${fmtSize(g.size)}</span></div>
        <div class="plats">${g.plats.map(p=>`<span title="${PLATFORMS[p].label}">${PLATFORMS[p].icon}</span>`).join("")}</div>
        ${g.play?`<button class="play-btn" data-play="${g.id}">▶ ${t("playNow")}</button>`:""}
        <div class="dl-mini">${t("download")}</div>
      </div>
    </article>`).join("") : `<div class="empty">${t("noResults")}</div>`;
}

function openGame(id){
  const g = GAMES.find(x=>x.id===id); if(!g) return;
  openId = id;
  const btns = kind => g.plats.filter(p=>PLATFORMS[p].kind===kind).map(p=>`
    <button class="dl-btn" data-dl="${g.id}:${p}">
      <span class="ic">${PLATFORMS[p].icon}</span>
      <span>${esc(L(g.name))} ${t("downloadFor")} ${PLATFORMS[p].label}<small>${PLATFORMS[p].ext} · v${g.ver} · ${fmtSize(g.size)}</small></span>
      <span class="go">${t("download")}</span>
    </button>`).join("");
  const mob = btns("mobile"), pc = btns("pc");
  const shots = (g.shots&&g.shots.length ? g.shots : [null,null,null,null]).map((s,i)=>
    `<div class="shot" style="background:${grad(g.c)};filter:${s?"none":`hue-rotate(${i*25}deg)`}">${s?imgTag(s):g.emoji}</div>`).join("");
  $("#modal").innerHTML = `
    <div class="m-head">
      <div class="m-icon" style="background:${grad(g.c)}">${g.emoji}${imgTag(g.img)}</div>
      <div><h2>${esc(L(g.name))}</h2><p>${esc(g.dev)} · ${catName(g.cat)}</p><p class="stars">${stars(g.rating)} <span style="color:var(--muted)">${g.rating}</span></p></div>
      <button class="close" data-close aria-label="Close">✕</button>
    </div>
    <div class="m-body">
      <div class="facts">
        <div class="fact"><b>${fmtDl(g.dl)}</b><small>${t("downloads")}</small></div>
        <div class="fact"><b>${fmtSize(g.size)}</b><small>${t("size")}</small></div>
        <div class="fact"><b>v${g.ver}</b><small>${t("version")}</small></div>
        <div class="fact"><b>${fmtDate(g.date)}</b><small>${t("updated")}</small></div>
      </div>
      ${g.play?`<button class="play-btn big" data-play="${g.id}">▶ ${t("playNow")}</button>`:""}
      <h4>${t("screenshots")}</h4>
      <div class="shots">${shots}</div>
      <h4>${t("about")}</h4>
      <p class="desc">${esc(L(g.desc))}</p>
      <h4>${t("download")}</h4>
      <div class="dl-list">
        ${mob?`<div class="dl-group">📱 ${t("mobile")}</div>${mob}`:""}
        ${pc?`<div class="dl-group">🖥️ ${t("pc")}</div>${pc}`:""}
      </div>
      <p class="note">${t("tip")}</p>
    </div>`;
  $("#overlay").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeModal(){ openId=null; $("#overlay").classList.remove("open"); document.body.style.overflow=""; }

function startDownload(key){
  const [id,p] = key.split(":"); const g = GAMES.find(x=>x.id==id);
  const url = g.links && g.links[p];
  if(!url){ toast(t("noLink")); return; }
  window.open(url,"_blank","noopener");
  toast(`⬇ ${t("starting")} ${L(g.name)} (${PLATFORMS[p].label})`);
}

/* ---- events ---- */
document.addEventListener("click",e=>{
  const x = e.target;
  const fav = x.closest("[data-fav]");
  if(fav){ e.stopPropagation(); const id=+fav.dataset.fav; favs.has(id)?favs.delete(id):favs.add(id); saveFavs(); renderGrid(); toast(favs.has(id)?t("favAdded"):t("favRemoved")); return; }
  const dl = x.closest("[data-dl]"); if(dl){ startDownload(dl.dataset.dl); return; }
  const pl = x.closest("[data-play]"); if(pl){ e.stopPropagation(); openPlayer(+pl.dataset.play); return; }
  if(x.closest("[data-close-player]")){ closePlayer(); return; }
  if(x.closest("[data-close]") || x===$("#overlay")){ closeModal(); return; }
  const card = x.closest(".card"); if(card){ openGame(+card.dataset.id); return; }
  const plat = x.closest("[data-plat]"); if(plat){ state.plat=plat.dataset.plat; renderFilters(); renderGrid(); return; }
  const cat = x.closest("[data-cat]"); if(cat){ state.cat=cat.dataset.cat; renderFilters(); renderGrid(); return; }
  const view = x.closest("[data-view]"); if(view){ state.view=view.dataset.view; document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b===view)); renderGrid(); return; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
$("#q").addEventListener("input",e=>{ state.q=e.target.value; renderGrid(); });
$("#sort").addEventListener("change",e=>{ state.sort=e.target.value; renderGrid(); });
$("#lang").addEventListener("change",e=>{ lang=e.target.value; try{localStorage.setItem("fph_lang",lang)}catch(_){} applyLang(); });
$("#logo").addEventListener("click",e=>{
  e.preventDefault();
  state={q:"",plat:"all",cat:"all",sort:"pop",view:"all"}; $("#q").value="";
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view==="all"));
  applyLang(); window.scrollTo({top:0,behavior:"smooth"});
});

/* =====================================================================
   5) PAYPAL DONATIONS
   Set ONE of these:
     username       : your PayPal.Me name  (https://paypal.me/YourName)  <- recommended, supports preset amounts
     hostedButtonId : the ID of a PayPal "Donate" button (amount chosen on PayPal)
   ===================================================================== */
const PAYPAL = { username:"", hostedButtonId:"", currency:"USD", amounts:[3,5,10,20] };
let donateOpen = false, donAmt = 5;

function payUrl(amount){
  if(PAYPAL.username) return `https://www.paypal.com/paypalme/${encodeURIComponent(PAYPAL.username)}/${amount}${PAYPAL.currency}`;
  if(PAYPAL.hostedButtonId) return `https://www.paypal.com/donate/?hosted_button_id=${encodeURIComponent(PAYPAL.hostedButtonId)}&currency_code=${PAYPAL.currency}`;
  return null;
}
function renderDonate(){
  $("#donateModal").innerHTML = `
    <button class="close" data-close-donate aria-label="Close">✕</button>
    <h2>💙 ${t("donateTitle")}</h2>
    <p>${t("donateChoose")}</p>
    <div class="amounts">${PAYPAL.amounts.map(a=>`<button class="amt ${a===donAmt?"active":""}" data-amt="${a}">${a} ${PAYPAL.currency}</button>`).join("")}</div>
    <input class="d-custom" id="dCustom" type="number" min="1" step="1" inputmode="decimal" placeholder="${t("donateOther")} (${PAYPAL.currency})">
    <button class="d-go" id="dGo">💳 ${t("donateGo")}</button>
    <p class="d-note">${t("donateSecure")}</p>`;
  $("#dCustom").addEventListener("input",e=>{
    const v = parseFloat(e.target.value);
    donAmt = v>0 ? v : 0;
    document.querySelectorAll(".amt").forEach(b=>b.classList.remove("active"));
  });
}
function openDonate(){ donateOpen=true; renderDonate(); $("#donateOverlay").classList.add("open"); document.body.style.overflow="hidden"; }
function closeDonate(){ donateOpen=false; $("#donateOverlay").classList.remove("open"); document.body.style.overflow=""; }

document.addEventListener("click",e=>{
  const x = e.target;
  if(x.closest("[data-donate]")){ openDonate(); return; }
  if(x.closest("[data-close-donate]") || x===$("#donateOverlay")){ closeDonate(); return; }
  const amt = x.closest("[data-amt]");
  if(amt){ donAmt=+amt.dataset.amt; document.querySelectorAll(".amt").forEach(b=>b.classList.toggle("active",b===amt)); const c=$("#dCustom"); if(c) c.value=""; return; }
  if(x.closest("#dGo")){
    if(!(donAmt>0)){ toast(t("donateInvalid")); return; }
    const url = payUrl(donAmt);
    if(!url){ toast(t("donateNoConfig")); return; }
    window.open(url,"_blank","noopener");
    toast(t("donateThanks"));
    closeDonate();
  }
});

  g.board = this.board.map(r => r.slice());\n    g.turn = this.turn; g.castle = { ...this.castle }; g.ep = this.ep;\n    g.over = this.over; g.result = this.result; g.halfmove = this.halfmove; g.last = this.last;\n    g.hist = []; g.san = []; g.keys = [];\n    return g;\n  }\n\n  key() {\n    return this.board.map(r => r.map(p => p || \"--\").join(\"\")).join(\"/\") + this.turn +\n      Object.values(this.castle).join(\"\") + (this.ep ? this.ep.join(\"\") : \"-\");\n  }\n\n  attacked(b, r, c, by) {\n    const d = by === \"w\" ? 1 : -1;\n    for (const dc of [-1, 1]) if (inside(r + d, c + dc) && b[r + d][c + dc] === by + \"P\") return true;\n    for (const [dr, dc] of KNIGHT) if (inside(r + dr, c + dc) && b[r + dr][c + dc] === by + \"N\") return true;\n    for (const [dr, dc] of KING) if (inside(r + dr, c + dc) && b[r + dr][c + dc] === by + \"K\") return true;\n    for (const [dirs, kinds] of [[DIAG, \"BQ\"], [STRAIGHT, \"RQ\"]]) {\n      for (const [dr, dc] of dirs) {\n        let rr = r + dr, cc = c + dc;\n        while (inside(rr, cc)) {\n          const p = b[rr][cc];\n          if (p) { if (p[0] === by && kinds.includes(p[1])) return true; break; }\n          rr += dr; cc += dc;\n        }\n      }\n    }\n    return false;\n  }\n\n  kingPos(b, color) {\n    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (b[r][c] === color + \"K\") return [r, c];\n    return null;\n  }\n\n  inCheck(b, color) {\n    const k = this.kingPos(b, color);\n    return this.attacked(b, k[0], k[1], color === \"w\" ? \"b\" : \"w\");\n  }\n\n  pseudo(r, c) {\n    const b = this.board, piece = b[r][c], color = piece[0], t = piece[1];\n    const enemy = color === \"w\" ? \"b\" : \"w\", out = [];\n    if (t === \"P\") {\n      const d = color === \"w\" ? -1 : 1, start = color === \"w\" ? 6 : 1;\n      if (inside(r + d, c) && !b[r + d][c]) {\n        out.push([r + d, c]);\n        if (r === start && !b[r + 2 * d][c]) out.push([r + 2 * d, c]);\n      }\n      for (const dc of [-1, 1] onst piece = this.board[r1][c1], color = piece[0], t = piece[1];\n    const capture = !!this.board[r2][c2] ||\n      (t === \"P\" && this.ep && this.ep[0] === r2 && this.ep[1] === c2 && c1 !== c2);\n    const base = fast ? null : this.sanBase(fr, to, piece, capture, promo);\n\n    this.apply(this.board, fr, to, promo);\n    if (t === \"K\") { this.castle[color + \"K\"] = 0; this.castle[color + \"Q\"] = 0; }\n    for (const [rr, cc, k] of [[7,0,\"wQ\"],[7,7,\"wK\"],[0,0,\"bQ\"],[0,7,\"bK\"]])\n      if ((r1 === rr && c1 === cc) || (r2 === rr && c2 === cc)) this.castle[k] = 0;\n    this.ep = (t === \"P\" && Math.abs(r2 - r1) === 2) ? [(r1 + r2) / 2, c1] : null;\n    this.halfmove = (t === \"P\" || capture) ? 0 : this.halfmove + 1;\n    this.turn = color === \"w\" ? \"b\" : \"w\";\n    this.last = [fr, to];\n    if (fast) return null;\n\n    const opp = this.turn, check = this.inCheck(this.board, opp);\n    this.keys.push(this.key());\n    let suffix = \"\";\n    if (!this.hasMoves(opp)) {\n      this.over = true;\n      if (check) { suffix = \"#\"; this.result = { kind: \"mate\", info: color === \"w\" ? \"الأبيض\" : \"الأسود\" }; }\n      else this.result = { kind: \"draw\", info: \"جمود (Stalemate)\" };\n    } else {\n      suffix = check ? \"+\" : \"\";\n      const last = this.keys[this.keys.length - 1];\n      if (this.insufficient()) { this.over = true; this.result = { kind: \"draw\", info: \"مواد غير كافية للكش مات\" }; }\n      else if (this.halfmove >= 100) { this.over = true; this.result = { kind: \"draw\", info: \"قاعدة الخمسين نقلة\" }; }\n      else if (this.keys.filter(k => k === last).length >= 3) { this.over = true; this.result = { kind: \"draw\", info: \"تكرار الوضعية ثلاث مرات\" }; }\n    }\n    this.san.push(base + suffix);\n    return this.over ? \"over\" : (check ? \"check\" : \"ok\");\n  }\n\n  undo() {\n    const h = this.hist.pop();\n    if (!h) return false;\n    this.board = h.board; this.turn = h.turn; this.castle = h.castle; this.ep = h.ep;\n    this.over = h.over; this.result = h.result; this.halfmove = h.halfmove; this.last = h.last;\n    this.san.length = h.ns; this.keys.length = h.nk;\n    return true;\n  }\n}\n\n/* ======================= الذكاء الاصطناعي ======================= */\nfunction evaluate(g) {\n  let s = 0;\n  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {\n    const p = g.board[r][c];\n    if (!p) continue;\n    const t = p[1];\n    let v = VAL[t];\n    const d = Math.abs(r - 3.5) + Math.abs(c - 3.5);\n    if (t === \"N\" || t === \"B\") v += Math.trunc(14 - 4 * d);\n    else if (t === \"P\") {\n      const adv = p[0] === \"w\" ? 6 - r : r - 1;\n      v += adv * 6 + Math.trunc(Math.max(0, 3 - d) * 2);\n    }\n    s += p[0] === \"w\" ? v : -v;\n  }\n  return g.turn === \"w\" ? s : -s;\n}\n\nfunction orderedMoves(g) {\n  const ms = [];\n  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {\n    const p = g.board[r][c];\n    if (!p || p[0] !== g.turn) continue;\n    for (const to of g.legal(r, c)) {\n      const v = g.board[to[0]][to[1]];\n      let score = v ? VAL[v[1]] * 10 - VAL[p[1]] : 0;\n      if (p[1] === \"P\" && (to[0] === 0 || to[0] === 7)) score += 800;\n      ms.push([score, Math.random(), [r, c], to]);\n    }\n  }\n  ms.sort((a, b) => b[0] - a[0] || b[1] - a[1]);\n  return ms.map(m => [m[2], m[3]]);\n}\n\nfunction qsearch(g, alpha, beta, d) {          // بحث الالتقاطات لتفادي أخطاء الأفق\n  const stand = evaluate(g);\n  if (d === 0 || stand >= beta) return stand;\n  if (stand > alpha) alpha = stand;\n  for (const [fr, to] of orderedMoves(g)) {\n    if (!g.board[to[0]][to[1]]) continue;\n    g.move(fr, to, \"Q\", true);\n    const s = -qsearch(g, -beta, -alpha, d - 1);\n    g.undo();\n    if (s >= beta) return s;\n    if (s > alpha) alpha = s;\n  }\n  return alpha;\n}\n\nfunction search(g, depth, alpha, beta) {\n  if (depth === 0) return qsearch(g, alpha, beta, 3);\n  const moves = orderedMoves(g);\n  if (!moves.length) return g.inCheck(g.board, g.turn) ? -100000 - depth : 0;\n  let best = -1e9;\n  for (const [fr, to] of moves) {\n    g.move(fr, to, \"Q\", true);\n    const s = -search(g, depth - 1, -beta, -alpha);\n    g.undo();\n    if (s > best) best = s;\n    if (s > alpha) alpha = s;\n    if (alpha >= beta) break;\n  }\n  return best;\n}\n\nfunction bestMove(g, depth, noise) {\n  let best = null, bestS = -1e9, alpha = -1e9;\n  for (const [fr, to] of orderedMoves(g)) {\n    g.move(fr, to, \"Q\", true);\n    let s = -search(g, depth - 1, -1e9, -alpha);\n    g.undo();\n    s += Math.floor(Math.random() * (2 * noise + 1)) - noise;\n    if (s > bestS) { bestS = s; best = [fr, to]; }\n    if (s > alpha) alpha = s;\n  }\n  return best;\n}\n\nconst LEVELS = { 1: [1, 60], 2: [2, 10], 3: [3, 3] };   // [العمق، العشوائية]\n<\/script>\n\n<script id=\"ui\">\n/* ============================ الواجهة ============================ */\nconst g = new Game();\nlet sel = null, targets = [], flip = false, thinking = false, busy = false, token = 0;\nconst $ = id => document.getElementById(id);\nconst human = () => { const m = $(\"mode\").value; return m === \"2p\" ? null : m; };\n\nfunction draw() {\n  const kc = g.inCheck(g.board, g.turn) ? g.kingPos(g.board, g.turn) : null;\n  let html = \"\";\n  for (let dr = 0; dr < 8; dr++) for (let dc = 0; dc < 8; dc++) {\n    const r = flip ? 7 - dr : dr, c = flip ? 7 - dc : dc;\n    let cls = \"sq \" + ((r + c) % 2 === 0 ? \"l\" : \"d\");\n    if (g.last && g.last.some(s => s[0] === r && s[1] === c)) cls += \" last\";\n    if (sel && sel[0] === r && sel[1] === c) cls += \" sel\";\n    else if (kc && kc[0] === r && kc[1] === c) cls += \" chk\";\n    const p = g.board[r][c];\n    if (targets.some(t => t[0] === r && t[1] === c)) cls += p ? \" capt\" : \" dot\";\n    html += `<div class=\"${cls}\" data-r=\"${r}\" data-c=\"${c}\">`;\n    if (p) html += `<span class=\"pc ${p[0]}\">${GLYPH[p[1]]}<\/span>`;\n    if (dc === 0) html += `<i class=\"rk\">${8 - r}<\/i>`;\n    if (dr === 7) html += `<i class=\"fl\">${\"abcdefgh\"[c]}<\/i>`;\n    html += \"<\/div>\";\n  }\n  $(\"board\").innerHTML = html;\n  panel();\n}\n\nfunction panel() {\n  let txt;\n  if (g.over) txt = g.result.kind === \"mate\" ? `كش مات! فاز ${g.result.info}` : `تعادل: ${g.result.info}`;\n  else if (thinking) txt = \"الكمبيوتر يفكر…\";\n  else {\n    txt = \"الدور على: \" + (g.turn === \"w\" ? \"الأبيض\" : \"الأسود\");\n    if (g.inCheck(g.board, g.turn)) txt += \" — كش!\";\n  }\n  $(\"status\").textContent = txt;\n\n  const cnt = { w: { Q: 0, R: 0, B: 0, N: 0, P: 0 }, b: { Q: 0, R: 0, B: 0, N: 0, P: 0 } };\n  const mat = { w: 0, b: 0 };\n  for (const row of g.board) for (const p of row) if (p && p[1] !== \"K\") { cnt[p[0]][p[1]]++; mat[p[0]] += VAL[p[1]]; }\n  const diff = Math.trunc((mat.w - mat.b) / 100);\n  const lost = col => \"QRBNP\".split(\"\").map(k => GLYPH[k].repeat(Math.max(0, INIT[k] - cnt[col][k]))).join(\"\");\n  $(\"capW\").innerHTML = `أخذها الأبيض: <b>${lost(\"b\")}<\/b>${diff > 0 ? ` (+${diff})` : \"\"}`;\n  $(\"capB\").innerHTML = `أخذها الأسود: <b>${lost(\"w\")}<\/b>${diff < 0 ? ` (+${-diff})` : \"\"}`;\n\n  let mv = \"\";\n  for (let i = 0; i < g.san.length; i += 2)\n    mv += `<span><em>${i / 2 + 1}.<\/em> ${g.san[i]} ${g.san[i + 1] || \"\"}<\/span>`;\n  const box = $(\"moves\");\n  box.innerHTML = mv;\n  box.scrollTop = box.scrollHeight;\n}\n\nfunction showOverlay(html, onClick) {\n  const o = $(\"overlay\");\n  $(\"ovbox\").innerHTML = html;\n  o.hidden = false;\n  o.onclick = e => { const b = e.target.closest(\"[data-k]\"); if (b) { o.hidden = true; o.onclick = null; onClick(b.dataset.k); } };\n}\n\nfunction askPromo() {\n  return new Promise(res => showOverlay(\n    `<h3>اختر القطعة<\/h3><div class=\"row\">` +\n    \"QRBN\".split(\"\").map(k => `<button class=\"pbtn\" data-k=\"${k}\">${GLYPH[k]}<\/button>`).join(\"\") + `<\/div>`, res));\n}\n\nfunction announce() {\n  const t = g.result.kind === \"mate\" ? `كش مات! فاز ${g.result.info}` : `تعادل: ${g.result.info}`;\n  showOverlay(`<h3>${t}<\/h3><div class=\"row\"><button data-k=\"new\">لعبة جديدة<\/button><button data-k=\"x\">إغلاق<\/button><\/div>`,\n    k => { if (k === \"new\") newGame(); });\n}\n\nlet actx = null;\nfunction tick() {\n  try {\n    actx = actx || new (window.AudioContext || window.webkitAudioContext)();\n    const o = actx.createOscillator(), gn = actx.createGain(), t = actx.currentTime;\n    o.type = \"triangle\"; o.frequency.value = g.san.length % 2 ? 330 : 260;\n    gn.gain.setValueAtTime(.08, t); gn.gain.exponentialRampToValueAtTime(.0001, t + .08);\n    o.connect(gn); gn.connect(actx.destination); o.start(); o.stop(t + .09);\n  } catch (e) {}\n}\n\nfunction afterMove() {\n  tick();\n  draw();\n  if (g.over) announce(); else maybeAI();\n}\n\nlet worker = null, workerFailed = false;\nfunction getWorker() {                                 // الحساب في خيط منفصل كي لا تتجمد الواجهة\n  if (worker || workerFailed) return worker;\n  try {\n    const src = document.getElementById(\"logic\").textContent +\n      \"\\nonmessage=e=>{const d=e.data,g=new Game();g.board=d.board;g.turn=d.turn;g.castle=d.castle;g.ep=d.ep;g.halfmove=d.halfmove;postMessage({id:d.id,mv:bestMove(g,d.depth,d.noise)});};\";\n    worker = new Worker(URL.createObjectURL(new Blob([src], { type: \"text/javascript\" })));\n  } catch (e) { workerFailed = true; worker = null; }\n  return worker;\n}\n\nfunction maybeAI() {\n  const h = human();\n  if (!h || g.over || g.turn === h) return;\n  thinking = true; draw();\n  const [depth, noise] = LEVELS[$(\"level\").value];\n  const tk = token;\n  const finish = mv => { if (tk !== token) return; thinking = false; if (mv) g.move(mv[0], mv[1], \"Q\"); afterMove(); };\n  const local = () => { const clone = g.clone(); setTimeout(() => finish(bestMove(clone, depth, noise)), 60); };\n  const w = getWorker();\n  if (!w) return local();\n  w.onmessage = e => { if (e.data.id === tk) finish(e.data.mv); };\n  w.onerror = () => { workerFailed = true; worker = null; local( \"><button data-k=\"left\">◀<\/button><button data-k=\"right\">▶<\/button><\/div>\n  <div class=\"pad\"><button data-k=\"brake\">■<\/button><button data-k=\"gas\">▲<\/button><\/div>\n<\/div>\n\n<div id=\"menu\" class=\"overlay\">\n  <div class=\"card\">\n    <h1>🏁 جائزة <span>F1<\/span> الكبرى<\/h1>\n    <p>سباق ضد 5 منافسين، فُز بالمركز الأول!<\/p>\n    <div class=\"row\"><label>مستوى الصعوبة<\/label>\n      <div class=\"seg\" id=\"segDiff\"><button data-v=\"1\">سهل<\/button><button data-v=\"2\">متوسط<\/button><button data-v=\"3\">صعب<\/button><\/div><\/div>\n    <div class=\"row\"><label>عدد اللفات<\/label>\n      <div class=\"seg\" id=\"segLaps\"><button data-v=\"1\">1<\/button><button data-v=\"3\">3<\/button><button data-v=\"5\">5<\/button><\/div><\/div>\n    <div class=\"row\"><label class=\"chk\"><input type=\"checkbox\" id=\"autoGas\"> تسارع تلقائي (مناسب للهاتف)<\/label><\/div>\n    <button class=\"go\" id=\"bStart\">ابدأ السباق<\/button>\n    <div class=\"hint\">الكيبورد: الأسهم أو WASD للقيادة، P للإيقاف، R للعودة للمضمار.<br>اقترب خلف سيارة لتستفيد من السحب الهوائي 🌀 وتزيد سرعتك.<br>الهاتف: أزرار على الشاشة. ابقَ على الأسفلت، فالعشب يبطئك.<\/div>\n  <\/div>\n<\/div>\n\n<div id=\"pauseOv\" class=\"overlay\" hidden>\n  <div class=\"card\"><h1>⏸ متوقف<\/h1>\n    <button class=\"go\" id=\"bResume\">متابعة<\/button>\n    <button class=\"go alt\" id=\"bQuit1\">القائمة الرئيسية<\/button><\/div>\n<\/div>\n\n<div id=\"results\" class=\"overlay\" hidden>\n  <div class=\"card\">\n    <h1 id=\"resTitle\">🏆 النتيجة<\/h1>\n    <p id=\"resSub\"><\/p>\n    <table id=\"resTable\"><\/table>\n    <button class=\"go\" id=\"bAgain\">سباق جديد<\/button>\n    <button class=\"go alt\" id=\"bQuit2\">القائمة الرئيسية<\/button>\n  <\/div>\n<\/div>\n\n<script>\n\"use strict\";\n(() => {\nconst TAU = Math.PI * 2;\nconst clamp = (v, a, b) => v < a ? a : v > b ? b : v;\nconst wrapA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };\nconst $ = id => document.getElementById(id);\n\n/* ============================ المضمار ============================ */\nconst TRACK_W = 170, KERB = 16, BARRIER = TRACK_W / 2 + KERB + 70;\nconst CP = [[-700,900],[200,900],[1100,900],[1700,860],[2100,650],[2150,300],[1850,50],[1400,100],\n            [1150,400],[800,350],[500,100],[0,-150],[-500,-100],[-900,150],[-1050,500],[-1000,800]];\n\nfunction crPoint(p0, p1, p2, p3, t) {            // Catmull-Rom (centripetal)\n  const d = (a, b) => Math.sqrt(Math.hypot(b[0] - a[0], b[1] - a[1]));\n  const t0 = 0, t1 = t0 + d(p0, p1), t2 = t1 + d(p1, p2), t3 = t2 + d(p2, p3), tt = t1 + (t2 - t1) * t;\n  const f = (a, b, ta, tb) => [((tb - tt) * a[0] + (tt - ta) * b[0]) / (tb - ta), ((tb - tt) * a[1] + (tt - ta) * b[1]) / (tb - ta)];\n  const A1 = f(p0, p1, t0, t1), A2 = f(p1, p2, t1, t2), A3 = f(p2, p3, t2, t3);\n  return f(f(A1, A2, t0, t2), f(A2, A3, t1, t3), t1, t2);\n}\n\nconst T = (() => {\n  const pts = [], n = CP.length;\n  for (let i = 0; i < n; i++) for (let k = 0; k < 40; k++)\n    pts.push(crPoint(CP[(i - 1 + n) % n], CP[i], CP[(i + 1) % n], CP[(i + 2) % n], k / 40));\n  const m = pts.length, cum = [0];\n  for (let i = 1; i <= m; i++) { const a = pts[i - 1], b = pts[i % m]; cum.push(cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); }\n  const L = cum[m], N = Math.round(L / 20), DS = L / N;\n  const X = new Float64Array(N), Y = new Float64Array(N);\n  for (let k = 0, j = 0; k < N; k++) {\n    const s = k * DS; while (cum[j + 1] < s) j++;\n    const f = (s - cum[j]) / (cum[j + 1] - cum[j]), a = pts[j], b = pts[(j + 1) % m];\n    X[k] = a[0] + (b[0] - a[0]) * f; Y[k] = a[1] + (b[1] - a[1]) * f;\n  }\n  const TX = new Float64Array(N), TY = new Float64Array(N), NX = new Float64Array(N), NY = new Float64Array(N);\n  const TH = new Float64Array(N), K = new Float64Array(N), VM = new Float64Array(N);\n  for (let i = 0; i < N; i++) {\n    const a = (i - 1 + N) % N, b = (i + 1) % N, dx = X[b] - X[a], dy = Y[b] - Y[a], l = Math.hypot(dx, dy);\n    TX[i] = dx / l; TY[i] = dy / l; NX[i] = -TY[i]; NY[i] = TX[i]; TH[i] = Math.atan2(TY[i], TX[i]);\n  }\n  for (let i = 0; i < N; i++) K[i] = Math.abs(wrapA(TH[(i + 2) % N] - TH[(i - 2 + N) % N])) / (4 * DS);\n  // سرعة الكمبيوتر القصوى في كل نقطة (مع مسافة الفرملة قبل المنعطفات)\n  const aF = 140, bF = 2.7, VAI_TOP = 262, AI_BRAKE = 300;\n  const vFromR = R => (aF / 2) * (-1 + Math.sqrt(1 + 4 * bF * R / aF));\n  for (let i = 0; i < N; i++) VM[i] = Math.min(VAI_TOP, vFromR(1 / Math.max(K[i], 1e-4)) * 0.84);\n  for (let it = 0; it < 3; it++) for (let i = N - 1; i >= 0; i--) {\n    const j = (i + 1) % N; VM[i] = Math.min(VM[i], Math.sqrt(VM[j] * VM[j] + 2 * AI_BRAKE * DS));\n  }\n  // مسارات الرسم\n  const center = new Path2D(), barL = new Path2D(), barR = new Path2D();\n  for (let i = 0; i < N; i++) {\n    const c = i ? \"lineTo\" : \"moveTo\";\n    center[c](X[i], Y[i]);\n    barL[c](X[i] - NX[i] * BARRIER, Y[i] - NY[i] * BARRIER);\n    barR[c](X[i] + NX[i] * BARRIER, Y[i] + NY[i] * BARRIER);\n  }\n  center.closePath(); barL.closePath(); barR.closePath();\n  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;\n  for (let i = 0; i < N; i++) { x0 = Math.min(x0, X[i]); x1 = Math.max(x1, X[i]); y0 = Math.min(y0, Y[i]); y1 = Math.max(y1, Y[i]); }\n  return { L, N, DS, X, Y, TX, TY, NX, NY, TH, K, VM, center, barL, barR, bb: [x0, y0, x1, y1] };\n})();\nconst { L, N, DS, X, Y, TX, TY, NX, NY, TH, VM } = T;\n\n/* ============================ السيارات ============================ */\nconst TEAMS = [\n  { n: \"أنت\", c: \"#e10600\" }, { n: \"VEX\", c: \"#1f6bff\" }, { n: \"ORB\", c: \"#ff8a00\" },\n  { n: \"JAD\", c: \"#00b36b\" }, { n: \"SLV\", c: \"#c9ced8\" }, { n: \"SUN\", c: \"#ffd400\" },\n];\nconst GRID_SLOT = [4, 0, 1, 2, 3, 5];\nconst BASE_LANE = [0, -30, 30, -18, 18, -8];\nconst VTOP = 340, ACC = 300, BRAKE_P = 430;\n\nconst settings = { diff: 2, laps: 3, autoGas: false };\ntry { Object.assign(settings, JSON.parse(localStorage.getItem(\"f1_settings\") || \"{}\")); } catch (e) {}\nconst coarse = (window.matchMedia && matchMedia(\"(pointer: coarse)\").matches) || innerWidth < 700;\nif (!localStorage_has(\"f1_settings\")) settings.autoGas = coarse;\nfunction localStorage_has(k) { try { return localStorage.getItem(k) !== null; } catch (e) { return false; } }\n\nconst cars = TEAMS.map((t, i) => ({\n  i, name: t.n, color: t.c, isPlayer: i === 0, x: 0, y: 0, h: 0, vx: 0, vy: 0, idx: 0, lat: 0, s: 0, prog: 0,\n  cross: 0, finished: false, finishT: 0, lapStart: 0, lastLap: 0, bestLap: Infinity, skill: 0.9, lane: 0,\n  baseLane: BASE_LANE[i], off: 0, stuck: 0, slot: GRID_SLOT[i],\n}));\nconst player = cars[0];\n\nlet state = \"menu\", paused = false, cdT = 0, goAt = 5, raceT = 0, doneT = 0, wrongT = 0;\nlet steerIn = 0;\nconst keys = { left: false, right: false, up: false, down: false }, touch = { left: false, right: false, gas: false, brake: false };\nlet autopilot = true;\n\nfunction placeOnGrid(c) {\n  const row = c.slot >> 1, side = (c.slot & 1) ? 1 : -1;\n  const s = L - (70 + row * 74), i = Math.floor(s / DS) % N, lane = side * 30;\n  c.x = X[i] + NX[i] * lane; c.y = Y[i] + NY[i] * lane; c.h = TH[i]; c.vx = c.vy = 0;\n  c.idx = i; c.lat = lane; c.s = i * DS; c.cross = 0; c.prog = c.s; c.finished = false; c.finishT = 0;\n  c.lapStart = 0; c.lastLap = 0; c.bestLap = Infinity; c.lane = c.baseLane; c.off = 0; c.stuck = 0;\n}\nfunction respawn(c) {\n  const i = c.idx; c.x = X[i]; c.y = Y[i]; c.h = TH[i]; c.vx = TX[i] * 50; c.vy = TY[i] * 50; c.lat = 0; c.stuck = 0; c.off = 0;\n}\nfunction applySkill() {\n  const base = { 1: 0.85, 2: 0.92, 3: 0.985 }[settings.diff] || 0.92;\n  cars.forEach(c => { c.skill = base - c.slot * 0.004 + Math.random() * 0.012; });\n}\nfunction resetGrid() { cars.forEach(placeOnGrid); applySkill(); snapCam(); }\n\n/* ============================ الفيزياء ============================ */\nfunction stepCar(c, dt, inp) {\n  // توجيه (معدل الدوران يقل مع السرعة)\n  let fx = Math.cos(c.h), fy = Math.sin(c.h);\n  const vf0 = c.vx * fx + c.vy * fy, sp = Math.abs(vf0);\n  const wmax = 2.7 / (1 + sp / 140), low = Math.min(1, sp / 40), dir = vf0 >= -5 ? 1 : -1;\n  c.h += inp.steer * wmax * low * dir * dt;\n  fx = Math.cos(c.h); fy = Math.sin(c.h);\n  const rx = -fy, ry = fx;\n  let vf = c.vx * fx + c.vy * fy, vl = c.vx * rx + c.vy * ry;\n  const a = Math.abs(c.lat);\n  c.off = a > TRACK_W / 2 + KERB * 0.7 ? 2 : (a > TRACK_W / 2 ? 1 : 0);\n\n  let acc = 0;\n  const vtop = VTOP * (c.slip ? 1.07 : 1);\n  if (inp.gas > 0) acc += inp.gas * ACC * (c.slip ? 1.2 : 1) * Math.max(0, 1 - vf / vtop);\n  if (inp.brake > 0) acc -= inp.brake * (vf > 8 ? BRAKE_P : (vf > -70 ? 110 : 0));\n  acc -= vf * 0.22;\n  if (c.off === 2) acc -= vf * 2.4 + Math.sign(vf) * 40; else if (c.off === 1) acc -= vf * 0.5;\n  vf += acc * dt;\n  vl *= Math.exp(-(c.off === 2 ? 2.5 : 6.5) * dt);\n\n  c.vx = fx * vf + rx * vl; c.vy = fy * vf + ry * vl;\n  c.x += c.vx * dt; c.y += c.vy * dt;\n}\n\nfunction slipstream(c) {            // السحب الهوائي خلف سيارة أمامك\n  const sp = Math.hypot(c.vx, c.vy);\n  if (sp < 120) return 0;\n  const fx = Math.cos(c.h), fy = Math.sin(c.h);\n  for (const o of cars) {\n    if (o === c) continue;\n    const dx = o.x - c.x, dy = o.y - c.y, fw = dx * fx + dy * fy, lt = Math.abs(-dx * fy + dy * fx);\n    if (fw > 25 && fw < 140 && lt < 20) return 1;\n  }\n  return 0;\n}\n\nfunction locate(c) {\n  let best = -1, bd = 1e18;\n  for (let k = -4; k <= 8; k++) {\n    const i = (c.idx + k + N) % N, dx = c.x - X[i], dy = c.y - Y[i], d2 = dx * dx + dy * dy;\n    if (d2 < bd) { bd = d2; best = i; }\n  }\n  if (bd > 250 * 250) {\n    bd = 1e18;\n    for (let i = 0; i < N; i++) { const dx = c.x - X[i], dy = c.y - Y[i], d2 = dx * dx + dy * dy; if (d2 < bd) { bd = d2; best = i; } }\n  }\n  const prev = c.idx; c.idx = best;\n  if (prev > N * 0.75 && best < N * 0.25) onCross(c, 1);\n  else if (prev < N * 0.25 && best > N * 0.75) onCross(c, -1);\n  const dx = c.x - X[best], dy = c.y - Y[best];\n  c.lat = dx * NX[best] + dy * NY[best];\n  c.s = best * DS + clamp(dx * TX[best] + dy * TY[best], -DS, DS);\n  c.prog = c.cross * L + c.s;\n  // جدار الإطارات\n  if (Math.abs(c.lat) > BARRIER) {\n    const sg = Math.sign(c.lat), nx = NX[best] * sg, ny = NY[best] * sg, over = Math.abs(c.lat) - BARRIER;\n    c.x -= nx * over; c.y -= ny * over; c.lat = sg * BARRIER;\n    const vo = c.vx * nx + c.vy * ny;\n    if (vo > 0) { c.vx -= nx * vo * 1.25; c.vy -= ny * vo * 1.25; c.vx *= 0.88; c.vy *= 0.88; }\n  }\n}\n\nfunction onCross(c, dir) {\n  if (state === \"menu\") return;\n  c.cross += dir;\n  if (dir < 0) return;\n  if (c.cross === 1) c.lapStart = raceT;\n  else if (c.cross >= 2 && c.cross <= settings.laps + 1) {\n    const lt = raceT - c.lapStart; c.lastLap = lt; c.lapStart = raceT;\n    const isBest = lt < c.bestLap;\n    if (isBest) { c.bestLap = lt; if (c.isPlayer) saveBest(lt); }\n    if (c.isPlayer && c.cross <= settings.laps) flash(\"⏱ \" + fmt3(lt) + (isBest ? \" 🟣\" : \"\"), 1400);\n  }\n  if (c.cross === settings.laps + 1 && !c.finished) {\n    c.finished = true; c.finishT = raceT;\n    if (c.isPlayer) { state = \"finished\"; doneT = 0; flash(rank(c) === 1 ? \"🏆 فزت!\" : \"🏁 انتهى السباق\", 2600); }\n  }\n}\n\nfunction collide(a, b) {\n  if (Math.abs(a.x - b.x) > 60 || Math.abs(a.y - b.y) > 60) return;\n  const ax = Math.cos(a.h), ay = Math.sin(a.h), bx = Math.cos(b.h), by = Math.sin(b.h), R = 22;\n  for (const oa of [-10, 10]) for (const ob of [-10, 10]) {\n    const dx = (b.x + bx * ob) - (a.x + ax * oa), dy = (b.y + by * ob) - (a.y + ay * oa), d = Math.hypot(dx, dy);\n    if (d < R && d > 0.001) {\n      const nx = dx / d, ny = dy / d, p = (R - d) / 2;\n      a.x -= nx * p; a.y -= ny * p; b.x += nx * p; b.y += ny * p;\n      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;\n      if (rv < 0) { const j = -1.15 * rv / 2; a.vx -= j * nx; a.vy -= j * ny; b.vx += j * nx; b.vy += j * ny; }\n    }\n  }\n}\n\n/* ============================ التحكم ============================ */\n سية<\/button><\/div>\n<\/div>\n\n<div id=\"overOv\" class=\"overlay\" hidden>\n  <div class=\"card\">\n    <h1>💀 انتهت الحياة<\/h1>\n    <div class=\"big\" id=\"oWave\">الموجة 1<\/div>\n    <p id=\"oSub\"><\/p>\n    <button class=\"go\" id=\"bAgain\">حاول مجددًا<\/button>\n    <button class=\"go alt\" id=\"bQuit2\">القائمة الرئيسية<\/button>\n  <\/div>\n<\/div>\n\n<script>\n\"use strict\";\n(() => {\nconst TAU = Math.PI * 2;\nconst clamp = (v, a, b) => v < a ? a : v > b ? b : v;\nconst $ = id => document.getElementById(id);\nconst rnd = (a, b) => a + Math.random() * (b - a);\n\n/* ============================ العالم ============================ */\nconst AW = 1500, AH = 1100, PAR = 36;\nconst DOORS = [[420, PAR + 10], [1080, PAR + 10], [420, AH - PAR - 10], [1080, AH - PAR - 10], [PAR + 10, 550], [AW - PAR - 10, 550]];\nconst PROPS = [\n  { x: 250, y: 210, w: 130, h: 80, t: \"ac\" }, { x: 1120, y: 210, w: 130, h: 80, t: \"ac\" },\n  { x: 640, y: 330, w: 220, h: 80, t: \"vent\" },\n  { x: 290, y: 770, w: 76, h: 76, t: \"crate\" }, { x: 1134, y: 770, w: 76, h: 76, t: \"crate\" },\n  { x: 700, y: 840, w: 100, h: 100, t: \"tank\" },\n];\n\nconst ZT = {\n  walker: { hp: 34, spd: 52, dmg: 10, r: 13, col: \"#6f9b5a\", sc: 2 },\n  runner: { hp: 20, spd: 108, dmg: 7, r: 11, col: \"#a3b84a\", sc: 2 },\n  brute:  { hp: 170, spd: 40, dmg: 22, r: 19, col: \"#4f6f4a\", sc: 6 },\n  boss:   { hp: 1000, spd: 48, dmg: 34, r: 30, col: \"#8a3f3f\", sc: 40 },\n};\nconst DIFFS = { 1: { hp: 0.8, spd: 0.92, dmg: 0.8 }, 2: { hp: 1, spd: 1, dmg: 1 }, 3: { hp: 1.3, spd: 1.1, dmg: 1.25 } };\n\nconst settings = { diff: 2 };\ntry { Object.assign(settings, JSON.parse(localStorage.getItem(\"zb_settings\") || \"{}\")); } catch (e) {}\nlet bestWave = 0;\ntry { bestWave = parseInt(localStorage.getItem(\"zb_best\") || \"0\", 10) || 0; } catch (e) {}\n\n/* ============================ الحالة ============================ */\nlet state = \"menu\", paused = false, time = 0;\nlet wave = 1, toSpawn = 0, spawnT = 0, bossPending = false;\nlet zombies = [], bullets = [], pickups = [], bars = [], parts = [], decals = [];\nlet shake = 0, flashTimer = 0, hurtTimer = 0;\nconst keys = { l: false, r: false, u: false, d: false };\nconst stick = { id: null, ox: 0, oy: 0, x: 0, y: 0 };\nconst mouse = { x: 0, y: 0, down: false, active: false };\nconst P = {};\n\nfunction newPlayer() {\n  Object.assign(P, {\n    x: 750, y: 620, r: 14, hp: 100, maxHp: 100, speed: 175, face: -Math.PI / 2, dmg: 14, rate: 1, pierce: 0,\n    shotgun: false, pellets: 5, ammo: 150, ammoMax: 300, scrap: 20, kills: 0, fireT: 0, magnet: 70, barMul: 1,\n    hurtT: 0, step: 0, lastDx: 0, lastDy: -1, muzzle: 0, ups: {}, regen: 0,\n  });\n}\nnewPlayer();\n\n/* ============================ القفزة: الموجات ============================ */\nfunction waveCount(w) { return 6 + w * 3; }\nfunction startWave() {\n  toSpawn = waveCount(wave); spawnT = 1.2; bossPending = wave % 5 === 0;\n  flash(bossPending ? \"⚠️ الموجة \" + wave + \" — زعيم!\" : \"الموجة \" + wave, 1800);\n  tone(160, 0.35, \"sawtooth\", 0.07);\n}\nfunction pickType() {\n  if (bossPending) { bossPending = false; return \"boss\"; }\n  const rr = Math.random(), pb = wave >= 4 ? 0.07 + wave * 0.012 : 0, pr = wave >= 2 ? 0.22 + wave * 0.02 : 0;\n  if (rr < pb) return \"brute\";\n  if (rr < pb + pr) return \"runner\";\n  return \"walker\";\n}\nfunction spawnZombie(type, x, y) {\n  const t = ZT[type], d = DIFFS[settings.diff];\n  const hs = (1 + 0.1 * (wave - 1)) * d.hp, ss = Math.min(1.4, 1 + 0.012 * (wave - 1)) * d.spd;\n  zombies.push({ type, x, y, r: t.r, hp: t.hp * hs, maxHp: t.hp * hs, spd: t.spd * ss * rnd(0.9, 1.1), dmg: t.dmg * d.dmg,\n    col: t.col, sc: t.sc, cd: 0, wob: rnd(0, TAU), flash: 0, face: 0, vx: 0, vy: 0, anim: rnd(0, TAU) });\n}\nfunction spawnFromDoor() {\n  const d = DOORS[(Math.random() * DOORS.length) | 0];\n  spawnZombie(pickType(), d[0] + rnd(-18, 18), d[1] + rnd(-18, 18));\n}\n\n/* ============================ الفيزياء والاصطدام ============================ */\nfunction pushRect(e, R) {\n  const cx = clamp(e.x, R.x, R.x + R.w), cy = clamp(e.y, R.y, R.y + R.h), dx = e.x - cx, dy = e.y - cy, d2 = dx * dx + dy * dy;\n  if (d2 >= e.r * e.r) return false;\n  if (d2 < 1e-6) {\n    const l = e.x - R.x, r = R.x + R.w - e.x, t = e.y - R.y, b = R.y + R.h - e.y, m = Math.min(l, r, t, b);\n    if (m === l) e.x = R.x - e.r; else if (m === r) e.x = R.x + R.w + e.r; else if (m === t) e.y = R.y - e.r; else e.y = R.y + R.h + e.r;\n  } else { const d = Math.sqrt(d2), k = (e.r - d) / d; e.x += dx * k; e.y += dy * k; }\n  return true;\n}\nfunction bounds(e) { e.x = clamp(e.x, PAR + e.r, AW - PAR - e.r); e.y = clamp(e.y, PAR + e.r, AH - PAR - e.r); }\nfunction solidify(e, isPlayer) {\n  for (const R of PROPS) pushRect(e, R);\n  for (let i = bars.length - 1; i >= 0; i--) {\n    const b = bars[i], dx = e.x - b.x, dy = e.y - b.y, d = Math.hypot(dx, dy), m = e.r + b.r;\n    if (d < m && d > 0.001) {\n      e.x += dx / d * (m - d); e.y += dy / d * (m - d);\n      if (!isPlayer) { b.hp -= e.dmg * 0.9 * (1 / 60); b.hitT = 0.15; }\n    }\n  }\n  bounds(e);\n}\n\n/* ============================ التأثيرات ============================ */\nfunction blood(x, y, n, col) {\n  for (let i = 0; i < n; i++) { const a = rnd(0, TAU), s = rnd(30, 150); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.25, 0.6), max: 0.6, r: rnd(1.5, 3.5), col }); }\n}\nfunction decal(x, y, r) { decals.push({ x, y, r, a: 0.55 }); if (decals.length > 140) decals.shift(); }\nfunction flash(text, ms) {\n  const m = $(\"msg\"); m.textContent = text; m.classList.add(\"show\");\n  clearTimeout(flashTimer); flashTimer = setTimeout(() => m.classList.remove(\"show\"), ms);\n}\n\n/* ============================ القتال ============================ */\nfunction nearestZombie(range) {\n  let best = null, bd = range * range;\n  for (const z of zombies) { const dx = z.x - P.x, dy = z.y - P.y, d2 = dx * dx + dy * dy; if (d2 < bd) { bd = d2; bes function openPlayer(id){
  const g = GAMES.find(x=>x.id===id); if(!g || !g.play) return;
  playingId = id;
  $("#pTitle").textContent = "🎮 " + L(g.name);
  $("#pNewTxt").textContent = t("openNewTab");
  $("#pCloseTxt").textContent = t("closePlayer");
  const fr = $("#pFrame"), html = EMBEDDED[g.play];
  if(html){
    blobUrl = URL.createObjectURL(new Blob([html],{type:"text/html;charset=utf-8"}));
    $("#pNew").href = blobUrl;
    fr.srcdoc = html;
  } else {
    $("#pNew").href = g.play;
    fr.removeAttribute("srcdoc");
    fr.src = g.play;
  }
  $("#playerOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closePlayer(){
  playingId = null;
  const fr = $("#pFrame"); fr.removeAttribute("srcdoc"); fr.src = "about:blank";
  if(blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl = null; }
  $("#playerOverlay").classList.remove("open");
  document.body.style.overflow = openId || donateOpen ? "hidden" : "";
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && playingId) closePlayer(); });

$("#pFs").addEventListener("click",()=>{
  const f = $("#pFrame"), r = f.requestFullscreen || f.webkitRequestFullscreen;
  if(r) try{ r.call(f); }catch(_){}
});
$("#yr").textContent = new Date().getFullYear();
applyLang();
